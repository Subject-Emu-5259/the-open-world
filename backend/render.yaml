# THE OPEN WORLD — PC hosted backend, Render Blueprint (TOW PC phase 2).
#
# Deploys the hosted backend (pc-backend.ts) as a Docker web service
# + a managed Postgres database, from the repo this file lives in.
# Apply it from the Render Dashboard: New -> Blueprint -> pick the
# repo -> Render creates both resources from this file. Nothing in
# this file spends money by itself — the plans below are the FREE
# tier (see the cost notes). Upgrading either service to a paid plan
# is a dashboard change Dre makes when he is ready (see
# backend/README.md "What it costs").
#
# PREREQUISITE: Render deploys from a Git repo, and the TOW tree is
# not a git repo today. Before this blueprint can run, the tree must
# be pushed to GitHub (backend/README.md step 0 — a Dre step).
#
# Shape mirrors Dispatch HQ's Render deploy (Dockerfile at the repo
# root there, Node 22 image, migrate-then-serve CMD). The Dockerfile
# here lives at backend/Dockerfile; the build context is the repo
# root, so the image sees package.json, src/, tools/, and backend/.

services:
  - type: web
    name: tow-pc-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    # Free plan: $0, spins down after 15 min idle, ~1 min cold start,
    # 750 free instance hours/month per workspace (shared with every
    # other free service). Production wants `starter` ($7/mo,
    # always-on) — change `plan` here or in the dashboard.
    plan: free
    region: oregon
    # One instance: the WS presence roster is in-memory, so a second
    # instance would split the roster. (Free only allows one anyway;
    # do not scale past 1 without a shared presence store.)
    numInstances: 1
    healthCheckPath: /health
    envVars:
      # Render injects PORT automatically — never set it here.
      - key: DATABASE_URL
        fromDatabase:
          name: tow-pc-db
          property: connectionString
      # TLS to Render Postgres is ON by default in the code
      # (TOW_PG_SSL unset = on). No other env vars are required.
      # Optional: TOW_SESSION_DAYS (default 30).

databases:
  - name: tow-pc-db
    # Free plan: $0, 1 GB storage, ONE per workspace — and it
    # EXPIRES 30 days after creation (14-day grace, then Render
    # deletes it with all data). Free is for proving the deploy;
    # any real players need the paid plan below. Upgrade in the
    # dashboard BEFORE day 30 or the saves are gone.
    plan: free
    region: oregon
    # Paid alternative (change `plan` to this when ready):
    #   plan: basic-256mb   # $6/mo compute + $0.30/GB storage
    #   (Basic's default disk is 15 GB -> $4.50/mo storage, so the
    #   paid database is $10.50/mo all-in. See README for the table.)
    postgresMajorVersion: 16
