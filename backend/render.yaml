# THE OPEN WORLD — PC hosted backend, Render Blueprint (TOW PC phase 2).
#
# Deploys the hosted backend (pc-backend.ts) as a Docker web service
# from the repo this file lives in. The database lives on SUPABASE,
# not Render: Render allows ONE free Postgres per workspace and
# dispatch-hq-db (Dispatch HQ's live database) already holds that
# slot, so the TOW database is a free Supabase project ("tow-pc")
# and this blueprint only creates the web service. DATABASE_URL is
# set in the Render dashboard (sync: false) from the Supabase
# project's DIRECT connection string — it is never committed to
# the repo. The Docker CMD runs the migration (001_init.sql,
# idempotent) before serving, so the first deploy creates the
# schema on the Supabase database.
#
# Apply it from the Render Dashboard: New -> Blueprint -> pick the
# repo -> Render creates the service from this file. Nothing in
# this file spends money by itself — the plan below is the FREE
# tier (see the cost notes). Upgrading the web service to a paid
# plan is a dashboard change Dre makes when he is ready (see
# backend/README.md "What it costs").
#
# Shape mirrors Dispatch HQ's Render deploy (Dockerfile at the repo
# root there, Node 22 image, migrate-then-serve CMD). The Dockerfile
# here lives at backend/Dockerfile; the build context is the repo
# root, so the image sees package.json, src/, tools/, and backend/.

services:
  - type: web
    name: tow-pc-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    # Free plan: $0, spins down after 15 min idle, ~1 min cold start,
    # 750 free instance hours/month per workspace (shared with every
    # other free service). Production wants `starter` ($7/mo,
    # always-on) — change `plan` here or in the dashboard.
    plan: free
    region: oregon
    # One instance: the WS presence roster is in-memory, so a second
    # instance would split the roster. (Free only allows one anyway;
    # do not scale past 1 without a shared presence store.)
    numInstances: 1
    healthCheckPath: /health
    envVars:
      # Render injects PORT automatically — never set it here.
      # DATABASE_URL is set in the dashboard from the Supabase
      # project's DIRECT connection string (port 5432, not the
      # 6543 pooler — the boot migration needs a direct
      # connection). sync: false keeps dashboard edits from being
      # overwritten on the next Blueprint sync.
      - key: DATABASE_URL
        sync: false
      # TLS to Supabase Postgres is ON by default in the code
      # (TOW_PG_SSL unset = on). No other env vars are required.
      # Optional: TOW_SESSION_DAYS (default 30).
